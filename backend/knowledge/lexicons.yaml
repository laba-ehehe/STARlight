# Word lists the extractors use to turn text into facts.
#   M1 (JD Analyzer):     competencies, early_career   → JD-CUE, EARLY-CAREER-CUE
#   M4 (Speech):          fillers                       → FILLER
#   M5 (Content):         everything else               → STAR-SEGMENT, HEDGE, REFLECTION, ...
#
# Matching (TextDocument.find_cues and M5): case-insensitive, whole words; a hyphen
# and a space are interchangeable ("cross-functional" = "cross functional"), and
# common suffixes are allowed (s, es, ed, d, ing, ership), so "lead" also matches
# "leading" and "leadership". Multi-word phrases match as written.
# Log changes in CHANGELOG.md.

competencies:
  teamwork:
    - team
    - teammate
    - collaborate
    - collaborative
    - collaboration
    - cross-functional
    - work closely with
    - partner with
    - stakeholder
    - interpersonal
