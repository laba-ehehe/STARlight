# M5 StarSegmenter: cue phrases that add to a sentence's score for each label.
# Grammar features and position priors are added in code (see PLAN §5 M5).
star_cues:
  situation:
    - when I was
    - while I was
    - at my internship
    - during my internship
    - last semester
    - last summer
    - last year
    - in my junior year
    - in my sophomore year
    - in one of my classes
    - for a class project
    - in my capstone
    - at my previous job
    - we were working on
    - there was a time
    - the situation was
    - the company
    - our team was
  task:
    - my role was
    - my job was
    - I was responsible for
    - I was in charge of
    - I was tasked with
    - I was asked to
    - I needed to
    - I had to
    - the goal was
    - our goal was
    - the challenge was
    - the problem was
    - we needed to
    - it was my responsibility
  action:
    - so I
    - first, I
    - then I
    - next, I
    - after that, I
    - I decided to
    - I started
    - I reached out
    - I set up
    - I scheduled
    - I proposed
    - I organized
    - I wrote
    - I built
    - I talked to
    - I suggested
    - I broke down
  result:
    - as a result
    - in the end
    - eventually
    - ultimately
    - the outcome was
    - the result was
    - we shipped
    - we launched
    - we delivered
    - we finished
    - it worked
    - which led to
    - that meant
    - I learned
    - my manager
    - the client

