name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # The job name is the required status check in .github/rulesets/main.json.
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Validate knowledge base
        run: |
          python -c "
          from starlight.core import KnowledgeBase
          problems = KnowledgeBase.load('knowledge').validate()
          print('\n'.join(map(str, problems)) or 'OK')
          raise SystemExit(1 if problems else 0)
          "
      - name: Test
        run: pytest -q
